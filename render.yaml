services:
  # Python FastAPI OCR Microservice
  - type: web
    name: legal-metrology-ocr
    runtime: docker
    rootDir: ocr-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OCR_USE_GPU
        value: "false"

  # Node.js Express Backend
  - type: web
    name: legal-metrology-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OCR_TIMEOUT_MS
        value: "30000"
      - key: STORAGE_DIR
        value: "./storage/uploads"
      - key: MAX_UPLOAD_SIZE_MB
        value: "15"
      - key: ALLOWED_MIME_TYPES
        value: "image/jpeg,image/png,image/webp,image/tiff"
