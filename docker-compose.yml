# docker-compose.yml — Local development orchestration
#
# Services:
#   db          — PostgreSQL 16 (data persisted in a named volume)
#   ocr-service — Python FastAPI OCR service
#   backend     — Node.js Express API (depends on db + ocr-service)
#
# Usage:
#   docker-compose up --build
#   docker-compose down -v   # removes volumes (clears DB data)

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_metrology_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      OCR_USE_GPU: "false"
      MAX_IMAGE_SIZE_MB: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - db
      - ocr-service
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/legal_metrology_db?schema=public"
      OCR_SERVICE_URL: "http://ocr-service:8000/api/v1/ocr/process-image"
      STORAGE_DIR: /app/storage/uploads
      MAX_UPLOAD_SIZE_MB: 15
      ALLOWED_MIME_TYPES: "image/jpeg,image/png,image/webp,image/tiff"
    volumes:
      - image_uploads:/app/storage/uploads

volumes:
  pg_data:
  image_uploads:
